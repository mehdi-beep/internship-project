services:
  db:
    image: postgres:16-alpine
    container_name: bims_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bims_user
      POSTGRES_PASSWORD: bims_password
      POSTGRES_DB: bims_db
    ports:
      - "5432:5432"
    volumes:
      - bims_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bims_user -d bims_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../../backend
      dockerfile: ../../additions/docker/backend.Dockerfile
    container_name: bims_backend
    restart: unless-stopped
    env_file:
      - ../../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://bims_user:bims_password@db:5432/bims_db
    ports:
      - "8000:8000"
    volumes:
      - ../../backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../../additions/docker/frontend.Dockerfile
    container_name: bims_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host

volumes:
  bims_postgres_data:
